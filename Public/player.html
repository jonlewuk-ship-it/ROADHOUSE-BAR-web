<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCID Player</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Rajdhani',sans-serif;overflow:hidden}

/* === AMBIENT BACKGROUND === */
.ambient{position:fixed;inset:0;z-index:0}
.ambient canvas{width:100%;height:100%}

/* === iPHONE 15 PRO === */
.phone{position:relative;z-index:1;width:393px;height:852px;border-radius:55px;background:#0c0c0c;
  border:2.5px solid transparent;
  background-clip:padding-box;
  overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,0.08),0 40px 100px rgba(0,0,0,0.9),0 0 80px rgba(0,200,255,0.06),0 0 80px rgba(200,0,255,0.04);
}
/* Neon edge glow */
.phone::before{content:'';position:absolute;inset:-3px;border-radius:57px;
  background:conic-gradient(from 0deg,#00e5ff,#7c4dff,#e91e63,#ff6d00,#00e5ff);
  opacity:0.25;z-index:-1;animation:edgeSpin 6s linear infinite;filter:blur(1px)}
@keyframes edgeSpin{to{filter:blur(1px) hue-rotate(360deg)}}
.phone::after{content:'';position:absolute;inset:0;border-radius:55px;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,0.03) 0%,transparent 50%);
  pointer-events:none;z-index:99}

/* Dynamic Island */
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px;z-index:100;
  box-shadow:0 0 0 1px rgba(255,255,255,0.05)}
.island .cam{width:11px;height:11px;border-radius:50%;background:radial-gradient(#1a237e 30%,#0d47a1 60%,#000 75%);margin:13px 0 0 78px}

/* Status bar */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:17px 30px 0;height:54px;color:#fff;font-size:15px;font-weight:700;font-family:'Rajdhani';letter-spacing:0.5px;position:relative;z-index:90}
.sbar .r{display:flex;align-items:center;gap:5px;font-size:12px}
.sbar .sig{display:flex;gap:1.5px;align-items:flex-end}
.sbar .sig i{width:3px;background:#fff;border-radius:1px}
.sbar .sig i:nth-child(1){height:4px}.sbar .sig i:nth-child(2){height:7px}.sbar .sig i:nth-child(3){height:10px}.sbar .sig i:nth-child(4){height:13px}
.sbar .bat{width:24px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative}
.sbar .bat::after{content:'';position:absolute;right:-4px;top:2px;width:2px;height:5px;background:#fff;border-radius:0 1px 1px 0}
.sbar .bat span{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:60%;background:#4caf50;border-radius:1px}

/* === APP CONTAINER === */
.app{width:100%;height:100%;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 20%,#0a1628 0%,#040810 40%,#000 100%)}

/* Grid overlay */
.grid-overlay{position:absolute;inset:0;
  background:
    linear-gradient(rgba(0,229,255,0.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,0.015) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse at 50% 40%,black 20%,transparent 70%);
  z-index:1;pointer-events:none}

/* Scan line */
.scanline{position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(0,229,255,0.08),transparent);
  z-index:2;pointer-events:none;animation:scanMove 4s linear infinite}
@keyframes scanMove{0%{top:-2px}100%{top:100%}}

/* === CAR CONNECTION === */
.conn{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 24px 0;padding:7px 16px;
  background:linear-gradient(135deg,rgba(180,20,40,0.12),rgba(60,10,20,0.18));
  border:1px solid rgba(220,40,60,0.2);border-radius:24px;position:relative;z-index:10;
  backdrop-filter:blur(20px)}
.conn .dot{width:7px;height:7px;border-radius:50%;background:#4caf50;box-shadow:0 0 8px #4caf50,0 0 16px rgba(76,175,80,0.3);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.conn .bt{font-size:12px;color:rgba(255,255,255,0.35)}
.conn .label{font-size:11px;color:rgba(255,255,255,0.45);letter-spacing:0.5px}
.conn .name{font-family:'Orbitron';font-size:9px;font-weight:700;color:#ef5350;letter-spacing:2px;
  text-shadow:0 0 10px rgba(239,83,80,0.3)}

/* === HOLOGRAM ZONE === */
.holo-zone{position:relative;width:310px;height:310px;margin:8px auto 0;z-index:10}

/* Canvas visualizer sits behind album */
#vizCanvas{position:absolute;inset:0;z-index:1}

/* Holographic geometric shapes */
.geo{position:absolute;border:1px solid;animation:geoSpin linear infinite;opacity:0.15}
.geo:nth-child(1){width:290px;height:290px;top:10px;left:10px;border-color:#00e5ff;border-radius:50%;animation-duration:20s}
.geo:nth-child(2){width:305px;height:305px;top:2.5px;left:2.5px;border-color:#e91e63;border-radius:50%;animation-duration:30s;animation-direction:reverse;border-style:dashed}
.geo:nth-child(3){width:260px;height:260px;top:25px;left:25px;border-color:#7c4dff;animation-duration:15s;transform-origin:center;border-radius:4px}
@keyframes geoSpin{to{transform:rotate(360deg)}}

/* Album art with circular progress ring */
.album-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5}
#progressRing{position:absolute;top:-12px;left:-12px}
.album{width:192px;height:192px;border-radius:22px;overflow:hidden;position:relative;
  box-shadow:0 0 40px rgba(0,229,255,0.25),0 0 80px rgba(124,77,255,0.1),0 12px 40px rgba(0,0,0,0.7)}
.album img{width:100%;height:100%;object-fit:cover;display:block}
/* Holographic sheen */
.album::after{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,229,255,0.12) 0%,transparent 35%,transparent 65%,rgba(233,30,99,0.08) 100%);
  animation:sheen 3s ease-in-out infinite alternate}
@keyframes sheen{0%{opacity:0.3}100%{opacity:0.8}}

/* Floating holo-projection base */
.holo-base{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:200px;height:8px;
  background:radial-gradient(ellipse,rgba(0,229,255,0.25),transparent 70%);filter:blur(4px);z-index:0}

/* === TRACK INFO === */
.info{text-align:center;margin-top:6px;position:relative;z-index:10}
.info .title{font-family:'Orbitron';font-size:18px;font-weight:800;color:#fff;letter-spacing:2px;
  background:linear-gradient(90deg,#fff,#00e5ff,#fff);background-size:200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:titleShift 4s ease-in-out infinite}
@keyframes titleShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.info .artist{font-family:'Orbitron';font-size:11px;font-weight:600;color:#e91e63;letter-spacing:3px;margin-top:1px;
  text-shadow:0 0 15px rgba(233,30,99,0.4)}
.info .meta{font-size:10px;color:rgba(255,255,255,0.25);letter-spacing:1px;margin-top:2px}
.info .badges{display:flex;justify-content:center;gap:8px;margin-top:5px}
.info .badge{display:flex;align-items:center;gap:3px;padding:2px 10px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;
  font-size:8px;color:rgba(255,255,255,0.4);letter-spacing:1.5px}

/* === WAVEFORM === */
#waveCanvas{display:block;margin:8px auto 0;position:relative;z-index:10}

/* === PROGRESS === */
.prog{margin:4px 32px 0;position:relative;z-index:10}
.prog .track{width:100%;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:visible;position:relative}
.prog .fill{height:100%;width:0%;border-radius:2px;position:relative;
  background:linear-gradient(90deg,#00e5ff,#7c4dff,#e91e63)}
.prog .fill::after{content:'';position:absolute;right:-5px;top:-4px;width:11px;height:11px;
  background:#fff;border-radius:50%;box-shadow:0 0 10px #00e5ff,0 0 20px rgba(0,229,255,0.3)}
.prog .times{display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:rgba(255,255,255,0.3);font-variant-numeric:tabular-nums}

/* === CONTROLS === */
.ctrls{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:8px;position:relative;z-index:10}
.cbtn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.5);transition:0.2s;padding:4px}
.cbtn:hover{color:#fff}
.cbtn svg{display:block}
.play{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;position:relative;
  background:linear-gradient(135deg,#00e5ff,#7c4dff);
  box-shadow:0 0 30px rgba(0,229,255,0.3),0 0 60px rgba(124,77,255,0.15);transition:0.2s}
.play:hover{transform:scale(1.08);box-shadow:0 0 40px rgba(0,229,255,0.5)}
.play::before{content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(0,229,255,0.2);animation:playRing 3s linear infinite;pointer-events:none}
@keyframes playRing{0%{transform:scale(1);opacity:0.4}100%{transform:scale(1.3);opacity:0}}
.play svg{position:absolute;top:50%;left:52%;transform:translate(-50%,-50%);color:#fff}

/* === VOLUME === */
.vol{display:flex;align-items:center;gap:8px;margin:6px 40px 0;position:relative;z-index:10}
.vol svg{color:rgba(255,255,255,0.3);flex-shrink:0}
.vol .slider{flex:1;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;position:relative}
.vol .slider-fill{height:100%;width:72%;border-radius:2px;background:linear-gradient(90deg,rgba(0,229,255,0.4),rgba(124,77,255,0.4))}

/* === EQUALIZER === */
.eq{margin:6px 18px 0;padding:10px 14px 8px;
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);
  border-radius:18px;backdrop-filter:blur(20px);position:relative;z-index:10}
.eq .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.eq .head .t{font-family:'Orbitron';font-size:8px;color:rgba(0,229,255,0.6);letter-spacing:2.5px}
.eq .head .p{font-size:8px;color:rgba(233,30,99,0.5);letter-spacing:1px;padding:2px 10px;border:1px solid rgba(233,30,99,0.15);border-radius:10px}
#eqCanvas{display:block;width:100%;border-radius:8px}

/* === ADVANCED CONTROLS === */
.advrow{display:flex;justify-content:space-around;margin:6px 18px 0;position:relative;z-index:10}
.adv{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer}
.adv .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.35);transition:0.2s}
.adv .ic.on{border-color:rgba(0,229,255,0.3);color:#00e5ff;background:rgba(0,229,255,0.06);
  box-shadow:0 0 12px rgba(0,229,255,0.1)}
.adv span{font-size:7px;color:rgba(255,255,255,0.2);letter-spacing:0.8px;font-family:'Rajdhani';font-weight:600}

/* Mic status */
.mic-status{position:absolute;top:58px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:5px;padding:3px 12px;
  background:rgba(0,0,0,0.6);border:1px solid rgba(0,229,255,0.15);border-radius:14px;
  font-size:8px;color:rgba(0,229,255,0.6);letter-spacing:1.5px;font-family:'Orbitron';
  z-index:100;opacity:0;transition:opacity 0.4s;pointer-events:none}
.mic-status.on{opacity:1}
.mic-status .mic-dot{width:5px;height:5px;border-radius:50%;background:#00e5ff;
  box-shadow:0 0 6px #00e5ff;animation:blink 1.5s ease-in-out infinite}

/* Bottom bar */
.bbar{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;z-index:10}
.bbar .pill{width:134px;height:5px;background:rgba(255,255,255,0.25);border-radius:3px}
</style>
</head>
<body>

<!-- Ambient background canvas -->
<div class="ambient"><canvas id="ambientCanvas"></canvas></div>

<div class="phone">
  <div class="app">
    <div class="grid-overlay"></div>
    <div class="scanline"></div>

    <div class="island"><div class="cam"></div></div>

    <div class="sbar">
      <span>18:15</span>
      <div class="r">
        <div class="sig"><i></i><i></i><i></i><i></i></div>
        <span style="font-weight:800;font-size:11px">5G</span>
        <div class="bat"><span></span></div>
      </div>
    </div>

    <!-- Connection -->
    <div class="conn">
      <div class="dot"></div>
      <span class="bt">&#9741;</span>
      <span class="label">Connected to</span>
      <span class="name">ALFA GIULIA</span>
    </div>

    <!-- Hologram zone -->
    <div class="holo-zone">
      <div class="geo"></div><div class="geo"></div><div class="geo"></div>
      <canvas id="vizCanvas" width="310" height="310"></canvas>
      <div class="album-wrap">
        <svg id="progressRing" width="216" height="216" viewBox="0 0 216 216">
          <circle cx="108" cy="108" r="104" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
          <circle id="progCircle" cx="108" cy="108" r="104" fill="none" stroke="url(#progGrad)" stroke-width="2.5"
            stroke-linecap="round" stroke-dasharray="653.45" stroke-dashoffset="653.45"
            transform="rotate(-90 108 108)"/>
          <defs><linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00e5ff"/><stop offset="50%" stop-color="#7c4dff"/><stop offset="100%" stop-color="#e91e63"/>
          </linearGradient></defs>
        </svg>
        <div class="album"><img id="albumImg" alt="Pulse"/></div>
      </div>
      <div class="holo-base"></div>
    </div>

    <!-- Track info -->
    <div class="info">
      <div class="title">SORROW</div>
      <div class="artist">PINK FLOYD</div>
      <div class="meta">PULSE &middot; LIVE &middot; 1995</div>
      <div class="badges">
        <span class="badge"><svg width="10" height="7" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 8c2-4 4-6 6-6s4 2 6 6c2 4 4 6 6 6"/></svg>LOSSLESS</span>
        <span class="badge">24-BIT &middot; 96kHz</span>
        <span class="badge">SPATIAL</span>
      </div>
    </div>

    <!-- Waveform -->
    <canvas id="waveCanvas" width="333" height="32"></canvas>

    <!-- Progress -->
    <div class="prog">
      <div class="track"><div class="fill" id="progFill"></div></div>
      <div class="times"><span id="curTime">0:02</span><span>-10:47</span></div>
    </div>

    <!-- Controls -->
    <div class="ctrls">
      <button class="cbtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1zm3.66 6.82l5.77 4.07c.66.47 1.58-.01 1.58-.82V7.93c0-.81-.91-1.28-1.58-.82l-5.77 4.07c-.57.4-.57 1.24 0 1.64z"/></svg></button>
      <button class="cbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="play"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="cbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="cbtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17 6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1zm-3.66 6.82l-5.77 4.07C6.91 17.36 6 16.89 6 16.08V7.93c0-.81.91-1.28 1.58-.82l5.77 4.07c.57.4.57 1.24-.01 1.64z"/></svg></button>
    </div>

    <!-- Volume -->
    <div class="vol">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
      <div class="slider"><div class="slider-fill"></div></div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </div>

    <!-- EQ -->
    <div class="eq">
      <div class="head"><span class="t">EQUALIZER</span><span class="p">ROCK &middot; LIVE</span></div>
      <canvas id="eqCanvas" height="65"></canvas>
    </div>

    <!-- Advanced -->
    <div class="advrow">
      <button class="adv"><div class="ic on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg></div><span>SPATIAL</span></button>
      <button class="adv"><div class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 20V4"/></svg></div><span>BOOST</span></button>
      <button class="adv"><div class="ic on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4M4.22 4.22l2.83 2.83m9.9 9.9l2.83 2.83M1 12h4m14 0h4M4.22 19.78l2.83-2.83m9.9-9.9l2.83-2.83"/></svg></div><span>GLOW</span></button>
      <button class="adv"><div class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></div><span>LYRICS</span></button>
      <button class="adv"><div class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></div><span>QUEUE</span></button>
    </div>

    <div class="mic-status" id="micStatus"><div class="mic-dot"></div>MIC ACTIVE &middot; LIVE AUDIO</div>
    <div class="bbar"><div class="pill"></div></div>
  </div>
</div>

<script>

// ========== AMBIENT BACKGROUND ==========
const ac = document.getElementById('ambientCanvas');
const actx = ac.getContext('2d');
function resizeAmbient(){ac.width=window.innerWidth;ac.height=window.innerHeight}
resizeAmbient();window.addEventListener('resize',resizeAmbient);
const orbs=[
  {x:0.15,y:0.2,r:280,c:'#e91e63',vx:0.2,vy:0.15},
  {x:0.85,y:0.8,r:220,c:'#00bcd4',vx:-0.15,vy:-0.2},
  {x:0.5,y:0.5,r:200,c:'#7c4dff',vx:0.1,vy:-0.1},
  {x:0.2,y:0.7,r:160,c:'#ff6d00',vx:0.18,vy:0.12}
];
function drawAmbient(t){
  actx.fillStyle='rgba(0,0,0,0.08)';actx.fillRect(0,0,ac.width,ac.height);
  orbs.forEach(o=>{
    const px=ac.width*(o.x+Math.sin(t*0.0003*o.vx)*0.1);
    const py=ac.height*(o.y+Math.cos(t*0.0003*o.vy)*0.08);
    const g=actx.createRadialGradient(px,py,0,px,py,o.r);
    g.addColorStop(0,o.c+'40');g.addColorStop(1,'transparent');
    actx.fillStyle=g;actx.fillRect(0,0,ac.width,ac.height);
  });
}

// ========== CIRCULAR VISUALIZER ==========
const vc=document.getElementById('vizCanvas');
const vctx=vc.getContext('2d');
const vizBars=64;
const vizData=Array(vizBars).fill(0);
const vizTarget=Array(vizBars).fill(0);

// Fallback random targets when mic is off
function genVizTargetsFallback(){
  if(!micActive) for(let i=0;i<vizBars;i++) vizTarget[i]=0.15+Math.random()*0.85;
  setTimeout(genVizTargetsFallback,120+Math.random()*80);
}
genVizTargetsFallback();

function drawViz(t){
  vctx.clearRect(0,0,310,310);
  const cx=155,cy=155,innerR=112,maxBar=42;
  for(let i=0;i<vizBars;i++){
    vizData[i]+=(vizTarget[i]-vizData[i])*0.18;
    const angle=(i/vizBars)*Math.PI*2 - Math.PI/2;
    const barH=vizData[i]*maxBar;
    const x1=cx+Math.cos(angle)*innerR;
    const y1=cy+Math.sin(angle)*innerR;
    const x2=cx+Math.cos(angle)*(innerR+barH);
    const y2=cy+Math.sin(angle)*(innerR+barH);
    const hue=(i/vizBars)*280+t*0.02;
    vctx.beginPath();
    vctx.moveTo(x1,y1);vctx.lineTo(x2,y2);
    vctx.strokeStyle=`hsla(${hue},100%,65%,${0.4+vizData[i]*0.5})`;
    vctx.lineWidth=2.5;vctx.lineCap='round';vctx.stroke();
    // Glow dot at tip
    if(vizData[i]>0.5){
      vctx.beginPath();vctx.arc(x2,y2,1.5,0,Math.PI*2);
      vctx.fillStyle=`hsla(${hue},100%,80%,${vizData[i]*0.6})`;vctx.fill();
    }
  }
  // Inner glow ring
  vctx.beginPath();vctx.arc(cx,cy,innerR-2,0,Math.PI*2);
  vctx.strokeStyle='rgba(0,229,255,0.06)';vctx.lineWidth=1;vctx.stroke();
}

// ========== WAVEFORM ==========
const wc=document.getElementById('waveCanvas');
const wctx=wc.getContext('2d');
const wBars=100;
const wData=Array(wBars).fill(0);
const wTarget=Array(wBars).fill(0);

function genWaveTargetsFallback(){
  if(!micActive) for(let i=0;i<wBars;i++) wTarget[i]=0.1+Math.random()*0.9;
  setTimeout(genWaveTargetsFallback,100+Math.random()*60);
}
genWaveTargetsFallback();

function drawWave(t){
  wctx.clearRect(0,0,333,32);
  const w=333/wBars;
  for(let i=0;i<wBars;i++){
    wData[i]+=(wTarget[i]-wData[i])*0.15;
    const h=wData[i]*26;
    const hue=(i/wBars)*280;
    wctx.fillStyle=`hsla(${hue},100%,65%,${0.5+wData[i]*0.4})`;
    wctx.fillRect(i*w+0.5, 16-h/2, w-1, h);
  }
}

// ========== EQUALIZER ==========
const eqc=document.getElementById('eqCanvas');
const eqctx=eqc.getContext('2d');
const eqBands=[
  {f:'32',base:0.65},{f:'64',base:0.55},{f:'125',base:0.4},{f:'250',base:0.5},{f:'500',base:0.3},
  {f:'1K',base:0.7},{f:'2K',base:0.8},{f:'4K',base:0.45},{f:'8K',base:0.35},{f:'16K',base:0.5}
];
const eqData=eqBands.map(b=>b.base);

function drawEQ(t){
  const W=eqc.width, H=65;
  eqctx.clearRect(0,0,W,H);
  const bw=W/eqBands.length;
  eqBands.forEach((b,i)=>{
    const osc=Math.sin(t*0.003+i*0.9)*0.12+Math.sin(t*0.006+i*1.4)*0.06;
    eqData[i]+=(b.base+osc-eqData[i])*0.1;
    const val=Math.max(0.05,Math.min(1,eqData[i]));
    const barH=val*(H-18);
    const x=i*bw+bw*0.2;
    const barW=bw*0.45;
    const hue=(i/eqBands.length)*280;
    // Track bg
    eqctx.fillStyle='rgba(255,255,255,0.03)';
    eqctx.fillRect(x,4,barW,H-18);
    // Fill
    const g=eqctx.createLinearGradient(0,H-14,0,H-14-barH);
    g.addColorStop(0,`hsla(${hue},100%,55%,0.2)`);
    g.addColorStop(1,`hsla(${hue},100%,65%,0.8)`);
    eqctx.fillStyle=g;
    eqctx.fillRect(x,H-14-barH,barW,barH);
    // Thumb
    eqctx.fillStyle='#fff';
    eqctx.shadowColor=`hsla(${hue},100%,65%,0.5)`;eqctx.shadowBlur=6;
    eqctx.fillRect(x-2,H-14-barH-2,barW+4,4);
    eqctx.shadowBlur=0;
    // Label
    eqctx.fillStyle='rgba(255,255,255,0.25)';
    eqctx.font='500 8px Rajdhani';eqctx.textAlign='center';
    eqctx.fillText(b.f,x+barW/2,H-2);
  });
}

// ========== PROGRESS ==========
const totalSec=649; // 10:49
let elapsed=2;
const progFill=document.getElementById('progFill');
const progCircle=document.getElementById('progCircle');
const curTime=document.getElementById('curTime');
const circumference=653.45;

function updateProgress(){
  elapsed++;
  const pct=elapsed/totalSec;
  progFill.style.width=(pct*100)+'%';
  progCircle.setAttribute('stroke-dashoffset', circumference*(1-pct));
  const m=Math.floor(elapsed/60);const s=elapsed%60;
  curTime.textContent=m+':'+String(s).padStart(2,'0');
}
setInterval(updateProgress,1000);

const particles=[];
for(let i=0;i<60;i++){
  particles.push({
    x:Math.random(),y:Math.random(),
    vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,
    size:0.5+Math.random()*1.5,
    hue:Math.random()*360,
    life:Math.random()*1000
  });
}

// ========== MICROPHONE AUDIO ENGINE ==========
let micActive = false;
let audioCtx, analyser, freqData, timeDomainData;
const micStatusEl = document.getElementById('micStatus');
const playBtn = document.querySelector('.play');
const playSvg = playBtn.querySelector('svg');

function initMic() {
  if (micActive) return;

  // Check if getUserMedia is available at all
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    micStatusEl.textContent = 'MIC NOT SUPPORTED';
    micStatusEl.style.color = '#ef5350';
    micStatusEl.style.borderColor = 'rgba(239,83,80,0.3)';
    micStatusEl.classList.add('on');
    return;
  }

  // Show "connecting" immediately so user knows tap registered
  micStatusEl.textContent = 'CONNECTING MIC…';
  micStatusEl.style.color = 'rgba(0,229,255,0.6)';
  micStatusEl.style.borderColor = 'rgba(0,229,255,0.15)';
  micStatusEl.classList.add('on');

  // Create AudioContext synchronously inside gesture (Safari requirement)
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  // Resume synchronously inside gesture
  audioCtx.resume();

  navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  }).then(function(stream) {
    var source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.72;
    source.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeDomainData = new Uint8Array(analyser.frequencyBinCount);
    micActive = true;
    micStatusEl.innerHTML = '<span class="mic-dot"></span> MIC ACTIVE &middot; LIVE AUDIO';
    micStatusEl.style.color = 'rgba(0,229,255,0.6)';
    micStatusEl.style.borderColor = 'rgba(0,229,255,0.15)';
    playSvg.innerHTML = '<rect x="7" y="5" width="3.5" height="14" rx="1" fill="#fff"/><rect x="13.5" y="5" width="3.5" height="14" rx="1" fill="#fff"/>';
  }).catch(function(e) {
    console.error('Mic error:', e);
    micStatusEl.textContent = 'MIC DENIED — CHECK SETTINGS';
    micStatusEl.style.color = '#ef5350';
    micStatusEl.style.borderColor = 'rgba(239,83,80,0.3)';
    setTimeout(function(){ micStatusEl.classList.remove('on'); }, 4000);
  });
}

function updateFromMic() {
  if (!micActive || !analyser) return;
  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeDomainData);

  for (var i = 0; i < vizBars; i++) {
    var fi = Math.floor((i / vizBars) * freqData.length);
    vizTarget[i] = freqData[fi] / 255;
  }

  for (var i = 0; i < wBars; i++) {
    var ti = Math.floor((i / wBars) * timeDomainData.length);
    wTarget[i] = Math.abs(timeDomainData[ti] - 128) / 128;
  }

  var binsPer = Math.floor(freqData.length / eqBands.length);
  eqBands.forEach(function(b, i) {
    var sum = 0;
    for (var j = i * binsPer; j < (i + 1) * binsPer && j < freqData.length; j++) sum += freqData[j];
    b.base = (sum / binsPer) / 255;
  });
}

// Use ontouchstart (fires immediately on Safari) + onclick fallback
playBtn.ontouchstart = function(e){ e.preventDefault(); initMic(); };
playBtn.onclick = initMic;

// ========== MAIN LOOP ==========
function loop(t){
  updateFromMic();
  drawAmbient(t);
  drawViz(t);
  drawWave(t);
  eqc.width=eqc.parentElement.clientWidth;
  drawEQ(t);
  requestAnimationFrame(loop);
}

// Wait for font + image load
setTimeout(()=>{requestAnimationFrame(loop)},200);
</script>
