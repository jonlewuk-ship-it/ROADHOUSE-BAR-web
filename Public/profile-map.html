<!DOCTYPE html>

<title>Il Mio Universo Professionale</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#03050d;touch-action:none}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#conn{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
#viewport{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;overflow:hidden;cursor:grab}
#viewport.drag{cursor:grabbing}
#stage{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}

/* GLASS NODES */
.nd{position:absolute;transform-style:preserve-3d;cursor:pointer;transition:filter .25s}
.nd:hover{filter:brightness(1.22) drop-shadow(0 0 12px var(--g));z-index:20}
.nd:hover .nc{border-color:var(--g)}
.nc{
  width:var(--w);padding:15px 17px 14px;border-radius:16px;
  border:1px solid var(--b);
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015)),linear-gradient(155deg,var(--bg1),var(--bg2));
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:0 0 20px var(--gs),0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.2);
  position:relative;overflow:hidden;transform:translate(-50%,-50%);
}
.nc::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent 5%,var(--g) 50%,transparent 95%);opacity:.55}
.nc::after{content:'';position:absolute;top:-40%;left:-30%;width:60%;height:120%;background:linear-gradient(115deg,rgba(255,255,255,.08),transparent 60%);transform:rotate(8deg);pointer-events:none}
.ni{font-size:18px;margin-bottom:6px;display:block;line-height:1}
.nt{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:700;color:#f0f3f8;letter-spacing:-.2px;line-height:1.25;margin-bottom:3px}
.np{font-size:9px;color:var(--gb);font-weight:600;margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase}
.nd-desc{font-size:10px;color:#8a9bb8;line-height:1.5}
.tg{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.tg span{font-size:8px;padding:2px 7px;border-radius:5px;font-weight:500;background:var(--tb);color:var(--gb);border:1px solid var(--tbo);letter-spacing:.15px}

.flags-card .nc{text-align:center;padding:20px 22px}
.flags-glow{font-size:38px;letter-spacing:14px;display:block;margin-bottom:8px;animation:flagPulse 3s ease-in-out infinite}
@keyframes flagPulse{0%,100%{filter:drop-shadow(0 0 14px rgba(94,234,212,.25)) drop-shadow(0 0 28px rgba(224,201,127,.12))}50%{filter:drop-shadow(0 0 24px rgba(94,234,212,.5)) drop-shadow(0 0 48px rgba(224,201,127,.25))}}

/* TIMELINE YEAR MARKERS */
.ym{position:absolute;transform-style:preserve-3d;pointer-events:none;will-change:transform}
.yd{width:11px;height:11px;border-radius:50%;background:var(--yc);box-shadow:0 0 14px var(--yc),0 0 28px var(--yc),0 0 42px var(--yc);transform:translate(-50%,-50%);animation:yPulse 2.6s ease-in-out infinite}
.yl{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;color:#f0f3f8;letter-spacing:.5px;text-shadow:0 0 10px var(--yc),0 0 20px rgba(0,0,0,.6);white-space:nowrap}
@keyframes yPulse{0%,100%{opacity:.75}50%{opacity:1;box-shadow:0 0 20px var(--yc),0 0 40px var(--yc),0 0 60px var(--yc)}}

/* Vertical wire from card to timeline dot */
.wire{position:absolute;transform-style:preserve-3d;pointer-events:none;width:1px;background:linear-gradient(180deg,transparent,var(--wc) 50%,transparent);opacity:.35;transform-origin:top center}

/* OVERLAY */
#flip-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;pointer-events:none;opacity:0;transition:opacity .35s}
#flip-overlay.open{pointer-events:auto;opacity:1}
#flip-backdrop{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(3,5,13,.78);backdrop-filter:blur(22px)}
#flip-container{position:absolute;transform-style:preserve-3d;transition:all .7s cubic-bezier(.4,.0,.15,1)}
#flip-container.flipped{transform:translate(-50%,-50%) rotateY(180deg) !important}
.flip-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;overflow:hidden;border:1px solid rgba(94,234,212,.18);background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),linear-gradient(155deg,rgba(16,22,42,.94),rgba(8,12,24,.97));backdrop-filter:blur(30px) saturate(1.2);box-shadow:0 0 50px rgba(94,234,212,.08),0 25px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1)}
#flip-front{width:100%;height:100%;padding:15px 17px 14px;display:flex;flex-direction:column;justify-content:center}
#flip-back{position:absolute;top:0;left:0;transform:rotateY(180deg);overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(94,234,212,.18) transparent}
#flip-back::-webkit-scrollbar{width:5px}
#flip-back::-webkit-scrollbar-thumb{background:rgba(94,234,212,.18);border-radius:3px}
#fb-close{position:sticky;top:0;z-index:5;display:flex;justify-content:flex-end;padding:14px 18px 0;background:linear-gradient(180deg,rgba(12,18,36,.98) 60%,transparent)}
#fb-close button{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#7a8ba8;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
#fb-close button:hover{background:rgba(255,255,255,.12);color:#f0f3f8}
#fb-header{padding:0 26px 0;margin-bottom:4px}
#fb-icon{font-size:28px;margin-bottom:6px;display:block}
#fb-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:#f0f3f8;line-height:1.2;margin-bottom:3px}
#fb-period{font-size:12px;color:#7de8d8;font-weight:600;letter-spacing:.4px}
#fb-body{padding:8px 26px 30px;font-size:13.5px;line-height:1.75;color:#98a8c2}
#fb-body h3{font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:600;color:#d0dae8;margin:20px 0 7px}
#fb-body h3:first-child{margin-top:6px}
#fb-body ul{padding-left:17px;margin:6px 0}
#fb-body li{margin-bottom:5px}
#fb-body .hl{color:#f0f3f8;font-weight:500}
#fb-body .tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10.5px;font-weight:500;margin:2px 3px 2px 0;background:rgba(94,234,212,.08);color:#7de8d8;border:1px solid rgba(94,234,212,.14)}
#fb-body .ins{padding:11px 15px;border-radius:10px;margin:11px 0;background:linear-gradient(135deg,rgba(94,234,212,.05),rgba(94,234,212,.01));border-left:3px solid rgba(94,234,212,.35);font-size:12.5px;color:#a8bcd4}
#fb-body .ins strong{color:#7de8d8;font-weight:600}
#fb-body .mt{display:inline-block;padding:10px 14px;border-radius:10px;margin:4px;background:linear-gradient(135deg,rgba(94,234,212,.06),rgba(94,234,212,.01));border:1px solid rgba(94,234,212,.1);text-align:center}
#fb-body .mt .v{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:#7de8d8;display:block}
#fb-body .mt .l{font-size:9px;color:#5a7090;margin-top:2px;display:block;text-transform:uppercase;letter-spacing:.5px}
#fb-body a.li{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;margin-top:8px;background:linear-gradient(135deg,rgba(10,102,194,.18),rgba(10,102,194,.06));border:1px solid rgba(10,102,194,.35);color:#5eb3f5;text-decoration:none;font-size:12.5px;font-weight:600;transition:all .2s}
#fb-body a.li:hover{background:linear-gradient(135deg,rgba(10,102,194,.28),rgba(10,102,194,.12));border-color:rgba(10,102,194,.55)}
.photo-slot{width:100%;height:150px;border-radius:12px;margin:10px 0;background:linear-gradient(135deg,rgba(94,234,212,.04),rgba(167,139,250,.04));border:1px dashed rgba(94,234,212,.2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#5a7090;font-size:11px;text-align:center;padding:12px}
.photo-slot .em{font-size:26px}

#hud{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none}
#hd{position:absolute;top:20px;left:24px;pointer-events:auto}
#hd h1{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:800;color:#f4f7fb;letter-spacing:-.6px;line-height:1;text-shadow:0 0 30px rgba(94,234,212,.25)}
#hd h1 em{font-style:normal;background:linear-gradient(120deg,#5eead4,#7de8d8,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#hd p{font-size:12.5px;color:#8ba0bd;margin-top:6px;letter-spacing:.5px;font-weight:500}
#zc{position:absolute;bottom:18px;right:18px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#zc button{width:36px;height:36px;border-radius:10px;border:1px solid rgba(94,234,212,.15);background:rgba(255,255,255,.04);backdrop-filter:blur(14px);color:#7de8d8;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:'Space Grotesk',sans-serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
#zc button:hover{background:rgba(94,234,212,.12);border-color:rgba(94,234,212,.35)}
#zc button:active{transform:scale(.9)}
#hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:9px;color:#3a4c68;letter-spacing:1.3px;text-transform:uppercase;animation:br 3s ease-in-out infinite;pointer-events:none}
@keyframes br{0%,100%{opacity:.3}50%{opacity:.7}}
@media(max-width:640px){#hd h1{font-size:22px}#hd p{font-size:10.5px}.nc{padding:11px 13px 10px}.nt{font-size:11px}.nd-desc{font-size:9px}.tg span{font-size:7px}#fb-title{font-size:18px}#fb-body{font-size:12.5px;padding:8px 18px 26px}#fb-header{padding:0 18px}.yl{font-size:10px}}
</style>

<script>
var LINKEDIN='https://www.linkedin.com/in/tonydepalma3471';
var N=[
{id:'flags',icon:'',title:'Britannico \u00B7 Italiano',period:'Inglese madrelingua \u2022 Bilingue italiano',
desc:'Nato a Londra, vivo in Italia. Due culture, due lingue, un\u2019unica identit\u00E0 professionale.',
tags:['Inglese Madrelingua','Bilingue Italiano','Ponte Culturale'],
color:'#e0c97f',w:200,isFlags:true,
back:'<h3>\u{1F1EC}\u{1F1E7} Inglese \u2014 Madrelingua</h3><p>Sono nato e cresciuto a <span class="hl">Londra</span>, formato alla <span class="hl">St Joseph\u2019s Academy di Blackheath</span> fino al 1985. L\u2019inglese non \u00E8 una competenza acquisita: \u00E8 la mia <span class="hl">lingua madre</span>, parlata con fluidit\u00E0 nativa, idioma naturale e istinto culturale.</p><div class="ins"><strong>Vantaggio professionale:</strong> essere madrelingua inglese in un\u2019azienda software italiana non \u00E8 solo un plus comunicativo. Significa redigere documentazione, condurre demo internazionali, gestire relazioni con clienti multinazionali e progettare interfacce bilingue \u2014 tutto senza l\u2019attrito della traduzione.</div><h3>\u{1F1EE}\u{1F1F9} Italiano \u2014 Bilingue Completo</h3><p>Dopo il trasferimento in Irpinia da adolescente, ho raggiunto una <span class="hl">padronanza bilingue completa</span> dell\u2019italiano \u2014 professionale, tecnica e colloquiale. Oltre 35 anni di vita e lavoro in Italia hanno reso questa una vera seconda lingua madre.</p><h3>Il Ponte Culturale</h3><p>Questa doppia identit\u00E0 non \u00E8 solo linguistica. \u00C8 una <span class="hl">fluidit\u00E0 culturale</span> che plasma tutto: come mi rapporto ai clienti internazionali, come progetto interfacce bilingue, come mi muovo tra la concretezza anglosassone e la cultura relazionale italiana del business.</p><div class="ins"><strong>In pratica:</strong> ogni applicazione che costruisco con Claude ha supporto bilingue EN/IT completo \u2014 non tradotto automaticamente, ma scritto nativamente in entrambe le lingue.</div>'},

{id:'identity',icon:'\u{1F30D}',title:'Origini & Identit\u00E0',period:'Nato nel 1971 \u2022 Londra \u2192 Avellino',year:'1971',
desc:'Nato a Londra. Vivo a Pratola Serra (AV). Appassionato di tecnologia, ossessionato dai dettagli. Guido un\u2019Alfa Romeo Giulia.',
tags:['Londra','Pratola Serra','Alfa Giulia \u{1F3CE}\uFE0F','Tecnologia'],
color:'#94a3b8',w:180,
back:'<h3>Chi Sono</h3><p>Nato a <span class="hl">Londra, UK</span> \u2014 3 aprile 1971</p><p>Vivo a <span class="hl">Pratola Serra (AV)</span>, Italia</p><h3>Profilo Personale</h3><p>Sono appassionato di <span class="hl">tutto ci\u00F2 che riguarda la tecnologia</span>. Porto una particolare attenzione al dettaglio con un approccio professionale e metodico a ogni aspetto della disciplina lavorativa. Unisco capacit\u00E0 comunicative e organizzative a forti doti analitiche e di problem-solving.</p><div class="ins"><strong>La mia passione nascosta:</strong> a livello hobbistico progetto <span class="hl">dispositivi elettronici</span> \u2014 dalla schematica al circuito. \u00C8 il filo che unisce tutto ci\u00F2 che faccio: la curiosit\u00E0 di capire come funzionano le cose smontandole e ricostruendole meglio. La stessa mentalit\u00E0 che applico al codice, ai processi produttivi e ai sistemi.</div><p>Guido un\u2019<span class="hl">Alfa Romeo Giulia</span> \u{1F3CE}\uFE0F \u2014 perch\u00E9 anche l\u2019ingegneria, quando \u00E8 fatta bene, \u00E8 una forma d\u2019arte.</p><h3>Contatti</h3><p>\u{1F4E7} tony.m.depalma@gmail.com<br>\u{1F4F1} (+39) 333 8411624<br>\u{1F4CD} Parco delle Mimose 8, Pratola Serra (AV)</p><a class="li" href="'+LINKEDIN+'" target="_blank" rel="noopener">\u{1F517} Il mio profilo LinkedIn</a><div class="photo-slot"><span class="em">\u{1F4F7}</span><span>Spazio per la tua foto LinkedIn<br>(inserisci l\u2019URL dell\u2019immagine nel codice)</span></div>'},

{id:'education',icon:'\u{1F393}',title:'Formazione',period:'1985 \u2013 1995',year:'1985',
desc:'St Joseph\u2019s Academy Londra \u2192 ITI Guido Dorso Avellino \u2192 ISVOR FIAT Torino \u2192 Abilitazione professionale 90/100.',
tags:['Londra','Perito Elettrotecnico','ISVOR FIAT','Six Sigma','90/100'],
color:'#fb923c',w:188,
back:'<h3>St Joseph\u2019s Academy</h3><p>Blackheath, <span class="hl">Londra</span> \u2014 istruzione primaria e secondaria fino al 1985. La scuola in lingua inglese che ha formato le fondamenta della mia madrelingua.</p><h3>ITI \u201CGuido Dorso\u201D \u2014 Avellino (1990)</h3><ul><li><span class="hl">Diploma di Perito Elettrotecnico</span> \u2014 corso sperimentale in Automazione Industriale</li><li>Voto: <span class="hl">52/60</span></li></ul><h3>ISVOR FIAT \u2014 Torino (1993)</h3><div class="ins"><strong>Nota:</strong> ISVOR FIAT era l\u2019accademia di formazione interna d\u2019\u00E9lite del Gruppo FIAT. Essere selezionati indicava lo status di alto potenziale nell\u2019organizzazione.</div><ul><li><span class="hl">Six Sigma</span> \u2014 Analisi e gestione statistica dei processi produttivi</li><li>Controllo qualit\u00E0</li><li>Sistemi pneumatici/idraulici</li><li>Interfacciamento con sistemi <span class="hl">PLC Siemens</span></li></ul><h3>Abilitazione Professionale (1995)</h3><p>Conseguimento del diritto all\u2019esercizio della professione.</p><div class="mt"><span class="v">90/100</span><span class="l">Voto abilitazione</span></div>'},

{id:'fiat',icon:'\u{1F3ED}',title:'FMA / FIAT (Stellantis)',period:'1994 \u2013 2001',year:'1994',
desc:'Team Leader nella produzione automotive. Six Sigma SPC, formazione operatori. Premio PMQ 1999 \u2014 oltre \u20AC180k/anno risparmiati per stabilimento.',
tags:['Six Sigma','SPC','Premio PMQ','\u20AC180k/anno','Stellantis'],
color:'#f87171',w:192,
back:'<h3>Team Leader \u2014 FMA S.p.A.</h3><p>Gruppo FCA \u2192 Stellantis \u2022 Pratola Serra (AV) \u2022 <span class="hl">7 anni</span></p><div class="ins"><strong>Contesto:</strong> FMA Pratola Serra \u00E8 un importante stabilimento powertrain Stellantis. Produzione ad alto volume e alta posta in gioco, dove i difetti di qualit\u00E0 costano denaro reale.</div><h3>Qualit\u00E0 & Produzione</h3><ul><li>Analisi continua della qualit\u00E0 del ciclo produttivo con criteri <span class="hl">Six Sigma / SPC</span></li><li><span class="hl">Formazione e preparazione</span> di operatori \u201Con the job\u201D per lo sviluppo delle competenze in produzione e sui nuovi prototipi</li><li>Sviluppo di metodi per il <span class="hl">miglioramento continuo</span> del prodotto e dei processi</li></ul><h3>\u{1F3C6} Premio PMQ 1999</h3><p>Vincitore \u2014 Migliore Proposta di Miglioramento Qualit\u00E0:</p><p><em>\u201CPer l\u2019implementazione di un corretto controllo HW/SW delle teste cilindri nelle work station\u201D</em></p><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"><div class="mt"><span class="v">\u20AC180k+</span><span class="l">Risparmiati/anno</span></div><div class="mt"><span class="v">\u2193</span><span class="l">Fermi linea</span></div><div class="mt"><span class="v">\u2193</span><span class="l">Scarti</span></div><div class="mt"><span class="v">\u2193</span><span class="l">Tempi riavvio</span></div></div>'},

{id:'cie',icon:'\u{1F4A1}',title:'Illuminazione Pubblica',period:'2001 \u2013 2006',year:'2001',

color:'#fbbf24',w:195,
back:'<h3>Responsabile Tecnico \u2014 CIE s.a.s</h3><p>Operante sull\u2019intero territorio delle province di <span class="hl">Avellino e Benevento</span></p><div class="ins"><strong>Ampiezza inusuale:</strong> questo ruolo univa gestione amministrativa/contabile, project management tecnico e consulenza di sostenibilit\u00E0 in un\u2019unica posizione \u2014 dalla documentazione fiscale ai modelli energetici dell\u2019illuminazione stradale.</div><h3>Amministrazione & Contabilit\u00E0</h3><ul><li>Redazione e gestione della <span class="hl">documentazione fiscale</span>, pianificazione finanziaria</li><li>Responsabile dell\u2019<span class="hl">informatizzazione dei processi contabili</span></li><li>Gestione dei rapporti con i <span class="hl">consulenti del lavoro</span></li></ul><h3>Pianificazione & Gestione Progetti</h3><ul><li>Coordinamento di progetti complessi di <span class="hl">illuminazione pubblica e progettazione elettrica</span></li><li>Progetti completati <span class="hl">nei tempi e nei costi</span></li><li>Piani di manutenzione con approccio <span class="hl">TPM (Total Productive Maintenance)</span></li><li>Progetti di <span class="hl">risparmio energetico</span> per i comuni</li></ul><div class="ins"><strong>In anticipo sui tempi:</strong> ho applicato soluzioni \u201CEnergy Saving\u201D anni prima che l\u2019ESG diventasse un tema da consiglio d\u2019amministrazione.</div>'},

{id:'wind',icon:'\u{1F32C}\uFE0F',title:'Parchi Eolici & 3D',period:'2006 \u2013 2007',year:'2006',

color:'#38bdf8',w:182,
back:'<h3>Valutazioni Parchi Eolici \u2014 DMP Associates</h3><p>Studio di Ingegneria e Architettura, <span class="hl">Avellino</span></p><div class="ins"><strong>Ruolo di ponte:</strong> unire competenze di visualizzazione 3D e ingegneria ambientale \u2014 rendendo dati spaziali complessi accessibili a stakeholder non tecnici come investitori e pianificatori comunali.</div><ul><li>Produzione di <span class="hl">rendering virtuali e animazioni</span> per l\u2019analisi dell\u2019impatto ambientale</li><li>Studi di <span class="hl">microlocalizzazione (micro-siting)</span> con strumenti di modellazione 3D</li><li>Pipeline di collaborazione basata su <span class="hl">Google Earth\u00A9</span> per partner, investitori e colleghi</li></ul>'},

{id:'acca',icon:'\u{1F3E2}',title:'ACCA Software',period:'2007 \u2013 Oggi',year:'2007',

  // Year node bobs slightly independently for organic feel
  var ownFy=Math.sin(t*.5+yi*1.3)*2;
  yr.el.style.transform='translate3d('+cp.x+'px,'+(TL_Y+ownFy)+'px,0)';
  yr._x=cp.x;yr._y=TL_Y+ownFy;yr._cx=cp.x;yr._cy=cp.y+syncFy;yr._cz=cp.z;
}

cX.clearRect(0,0,cC.width,cC.height);

// Draw connection curves between cards
for(var ci=0;ci<CONN.length;ci++){var ai=CONN[ci][0],bi=CONN[ci][1];var ap=POS[ai],bp=POS[bi];var fA=Math.sin(t*.28+ai*.7)*4,fB=Math.sin(t*.28+bi*.7)*4;var pa=proj(ap.x,ap.y+fA,ap.z,rX,rY,zm,panX,panY);var pb=proj(bp.x,bp.y+fB,bp.z,rX,rY,zm,panX,panY);var dx=pb.sx-pa.sx,dy=pb.sy-pa.sy;var ln=Math.sqrt(dx*dx+dy*dy)||1;var nx=-dy/ln,ny=dx/ln;var cv=Math.min(ln*.22,35)*zm;var c1x=pa.sx+dx*.33+nx*cv,c1y=pa.sy+dy*.33+ny*cv;var c2x=pa.sx+dx*.67-nx*cv*.5,c2y=pa.sy+dy*.67-ny*cv*.5;var avgD=Math.min(1,Math.max(.1,(pa.sc+pb.sc)/2));var isSpine=ci>=2&&ci<=7;var gA=isSpine?.015:.008;var lw=isSpine?1.5:1;
cX.beginPath();cX.moveTo(pa.sx,pa.sy);cX.bezierCurveTo(c1x,c1y,c2x,c2y,pb.sx,pb.sy);cX.strokeStyle='rgba(94,234,212,'+(gA*avgD)+')';cX.lineWidth=7*zm;cX.stroke();
cX.beginPath();cX.moveTo(pa.sx,pa.sy);cX.bezierCurveTo(c1x,c1y,c2x,c2y,pb.sx,pb.sy);var gr=cX.createLinearGradient(pa.sx,pa.sy,pb.sx,pb.sy);gr.addColorStop(0,N[ai].color+(isSpine?'75':'42'));gr.addColorStop(1,N[bi].color+(isSpine?'75':'42'));cX.strokeStyle=gr;cX.lineWidth=lw*zm;cX.stroke()}

// Draw timeline: connect year nodes with a horizontal glowing curve
if(yEls.length>1){
  var pts=[];
  for(var ki=0;ki<yEls.length;ki++){pts.push(proj(yEls[ki]._x,yEls[ki]._y,0,rX,rY,zm,panX,panY))}
  // Outer glow
  cX.beginPath();cX.moveTo(pts[0].sx,pts[0].sy);
  for(var ki=1;ki<pts.length;ki++){var pp=pts[ki-1],cp=pts[ki];var mx=(pp.sx+cp.sx)/2,my=(pp.sy+cp.sy)/2;cX.quadraticCurveTo(pp.sx,pp.sy,mx,my)}
  cX.lineTo(pts[pts.length-1].sx,pts[pts.length-1].sy);
  cX.strokeStyle='rgba(94,234,212,.05)';cX.lineWidth=8*zm;cX.stroke();
  // Core line
  cX.beginPath();cX.moveTo(pts[0].sx,pts[0].sy);
  for(var ki=1;ki<pts.length;ki++){var pp=pts[ki-1],cp=pts[ki];var mx=(pp.sx+cp.sx)/2,my=(pp.sy+cp.sy)/2;cX.quadraticCurveTo(pp.sx,pp.sy,mx,my)}
  cX.lineTo(pts[pts.length-1].sx,pts[pts.length-1].sy);
  var tGrad=cX.createLinearGradient(pts[0].sx,pts[0].sy,pts[pts.length-1].sx,pts[pts.length-1].sy);
  tGrad.addColorStop(0,N[TIMELINE_INDICES[0]].color+'80');
  tGrad.addColorStop(1,N[TIMELINE_INDICES[TIMELINE_INDICES.length-1]].color+'80');
  cX.strokeStyle=tGrad;cX.lineWidth=1.5*zm;cX.stroke();
}

// Draw vertical wires from each timeline card down to its year node
for(var yi=0;yi<yEls.length;yi++){
  var yr=yEls[yi];
  var cardBottom=proj(yr._cx,yr._cy,yr._cz,rX,rY,zm,panX,panY);
  var yearTop=proj(yr._x,yr._y,0,rX,rY,zm,panX,panY);
  cX.beginPath();cX.moveTo(cardBottom.sx,cardBottom.sy);cX.lineTo(yearTop.sx,yearTop.sy);
  var wGrad=cX.createLinearGradient(cardBottom.sx,cardBottom.sy,yearTop.sx,yearTop.sy);
  wGrad.addColorStop(0,N[yr.cardIdx].color+'00');
  wGrad.addColorStop(.4,N[yr.cardIdx].color+'40');
  wGrad.addColorStop(1,N[yr.cardIdx].color+'80');
  cX.strokeStyle=wGrad;cX.lineWidth=1*zm;cX.stroke();
}

drawBg(t)}
requestAnimationFrame(animate);
window.addEventListener('resize',function(){initBg();szC()});
</script>
