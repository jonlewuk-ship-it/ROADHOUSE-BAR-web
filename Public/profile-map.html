<head>

<title>Antonio M. De Palma — Knowledge Universe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#03050d;touch-action:none}

#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#conn{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
#viewport{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;overflow:hidden;cursor:grab}
#viewport.drag{cursor:grabbing}
#stage{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}

.nd{position:absolute;transform-style:preserve-3d;cursor:pointer;transition:filter .25s}
.nd:hover{filter:brightness(1.25) drop-shadow(0 0 10px var(--g));z-index:20}
.nd:hover .nc{border-color:var(--g)}

.nc{
  width:var(--w);padding:14px 16px 13px;border-radius:14px;
  border:1px solid var(--b);
  background:linear-gradient(155deg,var(--bg1),var(--bg2));
  backdrop-filter:blur(18px);
  box-shadow:0 0 18px var(--gs),0 0 50px var(--gf),inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;overflow:hidden;transform:translate(-50%,-50%);
}
.nc::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,var(--g) 50%,transparent 95%);opacity:.45}

.ni{font-size:17px;margin-bottom:5px;display:block;line-height:1}
.nt{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:#e4e8f0;letter-spacing:-.2px;line-height:1.25;margin-bottom:3px}
.np{font-size:9px;color:var(--g);font-weight:600;margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase}
.nd-desc{font-size:10px;color:#7a8ba8;line-height:1.5}
.tg{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.tg span{font-size:8px;padding:2px 6px;border-radius:4px;font-weight:500;background:var(--tb);color:var(--g);border:1px solid var(--tbo);letter-spacing:.15px}
.tl-dot{position:absolute;bottom:-18px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--g);transform:translateX(-50%);box-shadow:0 0 8px var(--gs)}

/* ═══ FULLSCREEN FLIP OVERLAY ═══ */
#flip-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;
  pointer-events:none;opacity:0;transition:opacity .35s;
}
#flip-overlay.open{pointer-events:auto;opacity:1}
#flip-backdrop{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(3,5,13,.8);backdrop-filter:blur(20px);
}
#flip-container{
  position:absolute;transform-style:preserve-3d;
  transition:all .7s cubic-bezier(.4,.0,.15,1);
}
#flip-container.flipped{transform:translate(-50%,-50%) rotateY(180deg) !important}

.flip-face{
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:18px;overflow:hidden;
  border:1px solid rgba(94,234,212,.15);
  background:linear-gradient(155deg,rgba(14,20,40,.97),rgba(6,10,22,.98));
  box-shadow:0 0 40px rgba(94,234,212,.06),0 20px 60px rgba(0,0,0,.5);
}

#flip-front{
  width:100%;height:100%;
  padding:14px 16px 13px;
  display:flex;flex-direction:column;justify-content:center;
}
#flip-back{
  position:absolute;top:0;left:0;
  transform:rotateY(180deg);
  overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(94,234,212,.15) transparent;
}
#flip-back::-webkit-scrollbar{width:5px}
#flip-back::-webkit-scrollbar-thumb{background:rgba(94,234,212,.15);border-radius:3px}

#fb-close{
  position:sticky;top:0;z-index:5;display:flex;justify-content:flex-end;
  padding:16px 20px 0;
  background:linear-gradient(180deg,rgba(10,16,34,.98) 60%,transparent);
}
#fb-close button{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:#6b7a96;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
#fb-close button:hover{background:rgba(255,255,255,.1);color:#e4e8f0}

#fb-header{padding:0 28px 0;margin-bottom:4px}
#fb-icon{font-size:28px;margin-bottom:8px;display:block}
#fb-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:#e4e8f0;line-height:1.2;margin-bottom:3px}
#fb-period{font-size:12px;color:#5eead4;font-weight:600;letter-spacing:.4px}

#fb-body{padding:8px 28px 32px;font-size:14px;line-height:1.75;color:#8c9bb5}
#fb-body h3{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:#c5cfe0;margin:22px 0 8px}
#fb-body h3:first-child{margin-top:6px}
#fb-body ul{padding-left:18px;margin:6px 0}
#fb-body li{margin-bottom:5px}
#fb-body .hl{color:#e4e8f0;font-weight:500}
#fb-body .tag{display:inline-block;padding:4px 11px;border-radius:6px;font-size:11px;font-weight:500;margin:2px 3px 2px 0;background:rgba(94,234,212,.06);color:#5eead4;border:1px solid rgba(94,234,212,.1)}
#fb-body .ins{padding:12px 16px;border-radius:10px;margin:12px 0;background:rgba(94,234,212,.03);border-left:3px solid rgba(94,234,212,.25);font-size:13px;color:#9ab0c8}
#fb-body .ins strong{color:#5eead4;font-weight:600}
#fb-body .mt{display:inline-block;padding:10px 14px;border-radius:10px;margin:4px;background:rgba(94,234,212,.04);border:1px solid rgba(94,234,212,.07);text-align:center}
#fb-body .mt .v{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:#5eead4;display:block}
#fb-body .mt .l{font-size:9px;color:#506580;margin-top:2px;display:block;text-transform:uppercase;letter-spacing:.5px}

/* HUD */
#hud{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none}
#hd{position:absolute;top:16px;left:18px;pointer-events:auto}
#hd h1{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:800;color:#e4e8f0;letter-spacing:-.3px}
#hd h1 em{font-style:normal;color:#5eead4}
#hd p{font-size:9px;color:#3e506a;margin-top:2px;letter-spacing:.3px}
#zc{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:5px;pointer-events:auto}
#zc button{width:34px;height:34px;border-radius:9px;border:1px solid rgba(94,234,212,.12);background:rgba(8,14,30,.75);backdrop-filter:blur(10px);color:#5eead4;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:'Space Grotesk',sans-serif}
#zc button:hover{background:rgba(94,234,212,.1);border-color:rgba(94,234,212,.3)}
#zc button:active{transform:scale(.9)}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:8.5px;color:#2a3c55;letter-spacing:1.3px;text-transform:uppercase;animation:br 3s ease-in-out infinite;pointer-events:none}

@media(max-width:640px){

var bgC=document.getElementById('bg'),bgX=bgC.getContext('2d');
var bS=[],neb=[],dP=[];
function initBg(){
  bgC.width=innerWidth;bgC.height=innerHeight;var W=bgC.width,H=bgC.height;
  bS=[];for(var i=0;i<450;i++)bS.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.15,a:Math.random()*.45+.08,sp:Math.random()*.0005+.0001,ph:Math.random()*6.28});

  for(var j=0;j<neb.length;j++){var nb=neb[j];var p=.7+.3*Math.sin(t*nb.sp*500+nb.ph);var g=bgX.createRadialGradient(nb.x,nb.y,0,nb.x,nb.y,nb.rx*p);g.addColorStop(0,'hsla('+nb.h+',55%,45%,'+nb.a*p+')');g.addColorStop(.5,'hsla('+nb.h+',45%,25%,'+nb.a*p*.3+')');g.addColorStop(1,'transparent');bgX.fillStyle=g;bgX.beginPath();bgX.ellipse(nb.x,nb.y,nb.rx*p,nb.ry*p,0,0,6.28);bgX.fill()}
  for(var i=0;i<bS.length;i++){var s=bS[i];var f=.4+.6*Math.sin(t*s.sp*700+s.ph);bgX.beginPath();bgX.arc(s.x,s.y,s.r,0,6.28);bgX.fillStyle='rgba(190,210,240,'+s.a*f+')';bgX.fill()}
  for(var k=0;k<dP.length;k++){var dp=dP[k];dp.x+=dp.vx;dp.y+=dp.vy;if(dp.x<-10)dp.x=W+10;if(dp.x>W+10)dp.x=-10;if(dp.y<-10)dp.y=H+10;if(dp.y>H+10)dp.y=-10;bgX.beginPath();bgX.arc(dp.x,dp.y,dp.r,0,6.28);bgX.fillStyle='hsla('+dp.h+',65%,65%,'+(dp.a*(.6+.4*Math.sin(t*.25+k)))+')';bgX.fill()}
}

// ═══ BUILD NODES ═══
var stage=document.getElementById('stage');var nEls={};
for(var ni=0;ni<N.length;ni++){
  var n=N[ni];var el=document.createElement('div');el.className='nd';
  el.style.setProperty('--g',n.color);el.style.setProperty('--gs',n.color+'28');
  el.style.setProperty('--gf',n.color+'0e');el.style.setProperty('--b',n.color+'22');
  el.style.setProperty('--bg1',n.color+'0a');el.style.setProperty('--bg2','rgba(6,10,22,.94)');
  el.style.setProperty('--tb',n.color+'0c');el.style.setProperty('--tbo',n.color+'18');
  el.style.setProperty('--w',n.w+'px');
  var th='';for(var ti=0;ti<n.tags.length;ti++)th+='<span>'+n.tags[ti]+'</span>';
  el.innerHTML='<div class="nc"><span class="ni">'+n.icon+'</span><div class="nt">'+n.title+'</div><div class="np">'+n.period+'</div><div class="nd-desc">'+n.desc+'</div><div class="tg">'+th+'</div><div class="tl-dot"></div></div>';
  (function(data,elem){
    elem.addEventListener('click',function(e){e.stopPropagation();openFlip(data,elem)});
  })(n,el);
  stage.appendChild(el);nEls[n.id]={el:el};
}

// ═══ CONNECTIONS ═══
var cC=document.getElementById('conn'),cX=cC.getContext('2d');
function szC(){cC.width=innerWidth;cC.height=innerHeight}
szC();

// ═══ NAVIGATION: orbit + pan + zoom ═══
var vp=document.getElementById('viewport');
var rX=-5,rY=0,trX=-5,trY=0;
var panX=0,panY=0,tpX=0,tpY=0;
var zm=.82,tzm=.82;
var drg=false,panning=false,lm={x:0,y:0},vel={x:0,y:0},autoR=true,aT=null;

vp.addEventListener('pointerdown',function(e){
  drg=true;autoR=false;if(aT)clearTimeout(aT);
  panning=e.shiftKey||e.button===1||e.button===2;
  lm={x:e.clientX,y:e.clientY};vel={x:0,y:0};vp.classList.add('drag');
});
window.addEventListener('pointermove',function(e){
  if(!drg)return;var dx=e.clientX-lm.x,dy=e.clientY-lm.y;
  if(panning||e.shiftKey){tpX+=dx;tpY+=dy}
  else{trY+=dx*.2;trX-=dy*.2;trX=Math.max(-40,Math.min(40,trX));vel={x:dx*.2,y:-dy*.2}}
  lm={x:e.clientX,y:e.clientY};
});
window.addEventListener('pointerup',function(){drg=false;panning=false;vp.classList.remove('drag');aT=setTimeout(function(){autoR=true},8000)});
vp.addEventListener('contextmenu',function(e){e.preventDefault()});
vp.addEventListener('wheel',function(e){e.preventDefault();tzm+=e.deltaY<0?.08:-.08;tzm=Math.max(.3,Math.min(2.5,tzm))},{passive:false});

var lpd=0,lpc={x:0,y:0};
vp.addEventListener('touchstart',function(e){
  if(e.touches.length===2){
    var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    lpd=Math.sqrt(dx*dx+dy*dy);
    lpc={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};
  }
},{passive:true});
vp.addEventListener('touchmove',function(e){
  if(e.touches.length===2){
    var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    var d=Math.sqrt(dx*dx+dy*dy);
    tzm+=(d-lpd)*.004;tzm=Math.max(.3,Math.min(2.5,tzm));lpd=d;
    var cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
    tpX+=cx-lpc.x;tpY+=cy-lpc.y;lpc={x:cx,y:cy};
  }
},{passive:true});

function zoomBtn(d){tzm+=d*.12;tzm=Math.max(.3,Math.min(2.5,tzm))}
function resetView(){trX=-5;trY=0;tzm=.82;tpX=0;tpY=0;autoR=true}

// ═══ FULLSCREEN FLIP ═══
var flipOv=document.getElementById('flip-overlay');
var flipCont=document.getElementById('flip-container');
var flipFront=document.getElementById('flip-front');
var flipBack=document.getElementById('flip-back');
var flipOpen=false;

function openFlip(data,srcEl){
  if(flipOpen)return;flipOpen=true;
  // Get source card screen position
  var rect=srcEl.querySelector('.nc').getBoundingClientRect();
  var sx=rect.left+rect.width/2,sy=rect.top+rect.height/2;
  var sw=rect.width,sh=rect.height;

  // Target size: nearly fullscreen
  var tw=Math.min(600,innerWidth*.88),th=Math.min(innerHeight*.85,720);
  var tx=innerWidth/2,ty=innerHeight/2;

  // Setup front face (clone of card appearance)
  var th2='';for(var i=0;i<data.tags.length;i++)th2+='<span style="font-size:8px;padding:2px 6px;border-radius:4px;font-weight:500;background:'+data.color+'0c;color:'+data.color+';border:1px solid '+data.color+'18;letter-spacing:.15px;display:inline-block;margin:1px 2px">'+data.tags[i]+'</span>';
  flipFront.innerHTML='<span style="font-size:17px;display:block;margin-bottom:5px">'+data.icon+'</span><div style="font-family:Space Grotesk,sans-serif;font-size:12px;font-weight:700;color:#e4e8f0;margin-bottom:3px">'+data.title+'</div><div style="font-size:9px;color:'+data.color+';font-weight:600;margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase">'+data.period+'</div><div style="font-size:10px;color:#7a8ba8;line-height:1.5">'+data.desc+'</div><div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:7px">'+th2+'</div>';

  // Setup back content
  document.getElementById('fb-icon').textContent=data.icon;
  document.getElementById('fb-title').textContent=data.title;
  document.getElementById('fb-period').textContent=data.period;
  document.getElementById('fb-body').innerHTML=data.back;

  // Style faces
  flipFront.style.cssText='width:'+sw+'px;height:'+sh+'px;padding:14px 16px 13px;display:flex;flex-direction:column;justify-content:center;border-color:'+data.color+'22;';
  flipBack.style.cssText='position:absolute;top:0;left:0;width:'+tw+'px;height:'+th+'px;transform:rotateY(180deg);border-color:'+data.color+'22;';

  // Start position
  flipCont.style.cssText='left:'+sx+'px;top:'+sy+'px;width:'+sw+'px;height:'+sh+'px;transform:translate(-50%,-50%);transition:none;';
  flipCont.classList.remove('flipped');
  flipOv.classList.add('open');

  // Animate to center+fullscreen+flip
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    flipCont.style.transition='all .7s cubic-bezier(.4,.0,.15,1)';
    flipCont.style.left=tx+'px';flipCont.style.top=ty+'px';
    flipCont.style.width=tw+'px';flipCont.style.height=th+'px';
    flipCont.classList.add('flipped');
  })});
}

function closeFlip(){
  flipCont.classList.remove('flipped');
  flipCont.style.opacity='0';
  setTimeout(function(){flipOv.classList.remove('open');flipCont.style.opacity='1';flipOpen=false},500);
}
document.getElementById('flip-backdrop').addEventListener('click',closeFlip);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&flipOpen)closeFlip()});

// ═══ PROJECTION ═══
function proj(nx,ny,nz,rx,ry,s,px,py){
  var ry2=ry*.01745,rx2=rx*.01745;
  var cr=Math.cos(ry2),sr=Math.sin(ry2),cx=Math.cos(rx2),sx=Math.sin(rx2);
  var x1=nx*cr-nz*sr,z1=nx*sr+nz*cr;
  var y2=ny*cx-z1*sx,z2=ny*sx+z1*cx;
  var p=1200,sc=p/(p+z2);
  return{sx:innerWidth/2+x1*sc*s+px,sy:innerHeight/2+y2*sc*s+py,sc:sc*s}
}

// ═══ ANIMATE ═══
function animate(time){
  requestAnimationFrame(animate);var t=time*.001;
  if(!drg){if(autoR)trY+=.012;else{trY+=vel.x*.92;trX+=vel.y*.92;vel.x*=.94;vel.y*=.94}}
  rX+=(trX-rX)*.07;rY+=(trY-rY)*.07;zm+=(tzm-zm)*.07;
  panX+=(tpX-panX)*.1;panY+=(tpY-panY)*.1;

  stage.style.transform='translate('+panX+'px,'+panY+'px) scale('+zm+') rotateX('+rX+'deg) rotateY('+rY+'deg)';

  for(var i=0;i<N.length;i++){
    var p=POS[i];var fy=Math.sin(t*.28+i*.7)*4;
    nEls[N[i].id].el.style.transform='translate3d('+p.x+'px,'+(p.y+fy)+'px,'+p.z+'px)';
  }

  cX.clearRect(0,0,cC.width,cC.height);
  for(var ci=0;ci<CONN.length;ci++){
    var ai=CONN[ci][0],bi=CONN[ci][1];
    var ap=POS[ai],bp=POS[bi];
    var fA=Math.sin(t*.28+ai*.7)*4,fB=Math.sin(t*.28+bi*.7)*4;
    var pa=proj(ap.x,ap.y+fA,ap.z,rX,rY,zm,panX,panY);
    var pb=proj(bp.x,bp.y+fB,bp.z,rX,rY,zm,panX,panY);
    var dx=pb.sx-pa.sx,dy=pb.sy-pa.sy;var ln=Math.sqrt(dx*dx+dy*dy)||1;
    var nx=-dy/ln,ny=dx/ln;var cv=Math.min(ln*.22,35)*zm;
    var c1x=pa.sx+dx*.33+nx*cv,c1y=pa.sy+dy*.33+ny*cv;
    var c2x=pa.sx+dx*.67-nx*cv*.5,c2y=pa.sy+dy*.67-ny*cv*.5;
    var avgD=Math.min(1,Math.max(.1,(pa.sc+pb.sc)/2));
    var isSpine=ci<7;var bA=isSpine?.06:.025;var gA=isSpine?.015:.008;var lw=isSpine?1.5:1;
    cX.beginPath();cX.moveTo(pa.sx,pa.sy);cX.bezierCurveTo(c1x,c1y,c2x,c2y,pb.sx,pb.sy);
    cX.strokeStyle='rgba(94,234,212,'+(gA*avgD)+')';cX.lineWidth=7*zm;cX.stroke();
    cX.beginPath();cX.moveTo(pa.sx,pa.sy);cX.bezierCurveTo(c1x,c1y,c2x,c2y,pb.sx,pb.sy);
    var gr=cX.createLinearGradient(pa.sx,pa.sy,pb.sx,pb.sy);
    gr.addColorStop(0,N[ai].color+(isSpine?'70':'40'));gr.addColorStop(1,N[bi].color+(isSpine?'70':'40'));
    cX.strokeStyle=gr;cX.lineWidth=lw*zm;cX.stroke();
  }
  drawBg(t);
}
requestAnimationFrame(animate);
window.addEventListener('resize',function(){initBg();szC()});
</script>
